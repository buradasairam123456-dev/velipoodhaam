workflows:
  android-workflow:
    name: Android Debug APK
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create Android & Fix SDK
        script: |
          flutter create . --platforms=android --no-overwrite
          sed -i 's/compileSdk.*/compileSdk 34/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle.kts || true
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

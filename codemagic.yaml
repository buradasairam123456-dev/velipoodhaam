workflows:
  android-workflow:
    name: Velipoodhaam Build
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: UPGRADE share_plus and FORCE 35
        script: |
          echo "--- Upgrading share_plus to latest ---"
          cat pubspec.yaml | grep share_plus
          sed -i.bak 's/share_plus:.*/share_plus: ^11.0.0/' pubspec.yaml || true
          sed -i.bak 's/share_plus: ^.*/share_plus: ^11.0.0/' pubspec.yaml || true
          grep share_plus pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --org com.velipoodhaam.vayvi
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.velipoodhaam.vayvi"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }
              defaultConfig {
                  applicationId = "com.velipoodhaam.vayvi"
                  minSdk = 21
                  targetSdk = 35
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          flutter {
              source = "../.."
          }
          EOF
          cat android/app/build.gradle.kts
      - name: Build APK
        script: |
          flutter pub upgrade share_plus
          flutter pub get
          flutter build apk --release --split-per-abi --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

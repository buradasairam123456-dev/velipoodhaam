workflows:
  android-workflow:
    name: Velipoodhaam Build
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create and Force Patch to 34
        script: |
          flutter create . --platforms=android --org com.velipoodhaam.vayvi
          # FORCE 34 with perl - pakka work
          perl -i -pe 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle || true
          perl -i -pe 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle || true
          perl -i -pe 's/targetSdkVersion.*/targetSdkVersion 34/g' android/app/build.gradle || true
          perl -i -pe 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle || true
          # also force in local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "--- FINAL build.gradle ---"
          cat android/app/build.gradle
      - name: Upgrade share_plus to support 34
        script: |
          flutter pub upgrade share_plus
          flutter pub get
      - name: Build split APKs
        script: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./symbols --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

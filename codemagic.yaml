workflows:
  android-workflow:
    name: Android Debug Build
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Clean and Recreate Android
        script: |
          flutter clean
          rm -rf android
          flutter create . --platforms=android --project-name velipoodhaam --org com.velipoodhaam.trip
          flutter pub get
      - name: Build DEBUG APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

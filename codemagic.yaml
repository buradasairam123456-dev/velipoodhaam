workflows:
  android-workflow:
    name: Android Debug APK
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Fix android folder and SDK
        script: |
          flutter create . --platforms=android
          find . -name "build.gradle" -type f -exec sed -i -e 's/compileSdkVersion.*/compileSdkVersion 34/' -e 's/compileSdk .*/compileSdk 34/' -e 's/targetSdkVersion.*/targetSdkVersion 34/' -e 's/targetSdk .*/targetSdk 34/' {} \;
      - name: Build APK
        script: |
          flutter clean
          flutter pub get
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  android-workflow:
    name: Android Debug APK
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Fix android folder
        script: |
          flutter create . --platforms=android --no-overwrite
          find android -name "*.gradle" -exec sed -i -e 's/compileSdkVersion 33/compileSdkVersion 34/g' -e 's/compileSdk 33/compileSdk 34/g' -e 's/targetSdkVersion 33/targetSdkVersion 34/g' -e 's/targetSdk 33/targetSdk 34/g' {} \;
          cat android/app/build.gradle | grep -i Sdk
      - name: Build Debug APK
        script: |
          flutter clean
          flutter pub get
          flutter build apk --debug --verbose
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

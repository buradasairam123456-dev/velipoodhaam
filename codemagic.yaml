workflows:
  android-workflow:
    name: Android APK
    environment:
      flutter: stable
    scripts:
      - name: Create Android Folder
        script: flutter create . --platforms=android
      - name: Get Packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

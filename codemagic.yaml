workflows:
  android-workflow:
    name: Velipoodhaam Build
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: FORCE UPGRADE share_plus to 11
        script: |
          echo "BEFORE:"
          grep -A2 -B2 share_plus pubspec.yaml || true
          python3 -c "
          import re, pathlib
          p = pathlib.Path('pubspec.yaml').read_text()
          p = re.sub(r'share_plus:.*', 'share_plus: ^11.0.0', p)
          pathlib.Path('pubspec.yaml').write_text(p)
          "
          echo "AFTER:"
          grep -A2 -B2 share_plus pubspec.yaml
          rm -f pubspec.lock
          rm -rf android
          flutter create . --platforms=android --org com.velipoodhaam.vayvi
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.velipoodhaam.vayvi"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }
              defaultConfig {
                  applicationId = "com.velipoodhaam.vayvi"
                  minSdk = 21
                  targetSdk = 35
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          flutter {
              source = "../.."
          }
          EOF
          flutter pub get
          flutter pub upgrade share_plus
          grep share_plus pubspec.lock || true
      - name: Build APK
        script: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

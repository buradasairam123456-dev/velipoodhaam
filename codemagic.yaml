workflows:
  android-workflow:
    name: Velipoodhaam Build
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create Android and NUCLEAR PATCH to 34
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.velipoodhaam.vayvi
          echo "--- BEFORE PATCH ---"
          grep -n "compileSdk" android/app/build.gradle
          # NUCLEAR: Replace entire line containing compileSdk
          find android -type f -name "*.gradle" | xargs sed -i '' 's/.*compileSdk.*/    compileSdk = 34/g' || find android -type f -name "*.gradle" | xargs sed -i 's/.*compileSdk.*/    compileSdk = 34/g'
          find android -type f -name "*.gradle" | xargs sed -i '' 's/.*targetSdk.*/    targetSdk = 34/g' || find android -type f -name "*.gradle" | xargs sed -i 's/.*targetSdk.*/    targetSdk = 34/g'
          find android -type f -name "*.gradle" | xargs sed -i '' 's/.*compileSdkVersion.*/    compileSdkVersion 34/g' || find android -type f -name "*.gradle" | xargs sed -i 's/.*compileSdkVersion.*/    compileSdkVersion 34/g'
          # FORCE via local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "--- AFTER PATCH ---"
          grep -n "compileSdk" android/app/build.gradle
          cat android/app/build.gradle
      - name: Force upgrade all plugins to support 34
        script: |
          flutter pub upgrade
          flutter pub get
      - name: Build split APKs
        script: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./symbols --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  android-workflow:
    name: VAYVI Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get
      - name: Generate launcher icons
        script: |
          flutter pub run flutter_launcher_icons
      - name: Build Small APK (50MB target)
        script: |
          flutter build apk --release --split-per-abi --obfuscate --tree-shake-icons --shrink
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - buradasairam123456@gmail.com

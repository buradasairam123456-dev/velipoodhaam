workflows:
  android-workflow:
    name: Velipoodhaam Build
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create and REAL PATCH for gradle.kts
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.velipoodhaam.vayvi
          echo "--- Files ---"
          find android -type f | grep gradle
          echo "--- Patching ALL gradle files ---"
          for f in $(find android -type f -name "*.gradle*"); do
            echo "Patching $f"
            sed -i.bak "s/flutter.compileSdkVersion/34/g" "$f" || true
            sed -i.bak "s/flutter.targetSdkVersion/34/g" "$f" || true
            sed -i.bak "s/flutter.minSdkVersion/21/g" "$f" || true
          done
          echo "--- AFTER ---"
          grep -rn "compileSdk" android/app/ || true
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle
      - name: Upgrade plugins
        script: |
          flutter pub upgrade
          flutter pub get
      - name: Build APKs
        script: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

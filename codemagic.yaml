workflows:
  android-workflow:
    name: Android APK
    environment:
      flutter: stable
    scripts:
      - name: Recreate Android folder
        script: |
          rm -rf android
          flutter create . --platforms=android --project-name velipoodhaam --overwrite
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

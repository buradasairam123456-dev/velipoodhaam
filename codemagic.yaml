workflows:
  android-workflow:
    name: Android Debug APK
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix SDK and Build
        script: |
          flutter create . --platforms=android --no-overwrite
          python3 -c "
          import pathlib, re
          p=pathlib.Path('android/app/build.gradle').read_text()
          p=re.sub(r'compileSdkVersion\s+\d+','compileSdkVersion 34',p)
          p=re.sub(r'compileSdk\s+\d+','compileSdk 34',p)
          p=re.sub(r'targetSdkVersion\s+\d+','targetSdkVersion 34',p)
          p=re.sub(r'targetSdk\s+\d+','targetSdk 34',p)
          pathlib.Path('android/app/build.gradle').write_text(p)
          print(p[:500])
          "
          flutter pub get
          flutter build apk --debug -v
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  android-workflow:
    name: Velipoodhaam Build NO-SHARE
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: REMOVE share_plus completely
        script: |
          echo "Removing share_plus from pubspec..."
          python3 -c "
          import re, pathlib
          p = pathlib.Path('pubspec.yaml').read_text()
          # Remove share_plus line
          p = re.sub(r'.*share_plus.*\n', '', p)
          pathlib.Path('pubspec.yaml').write_text(p)
          "
          echo "Patching Dart files to remove Share usage..."
          find lib -name '*.dart' -type f | while read f; do
            sed -i.bak "s/import.*share_plus.*/\/\/ share_plus removed/" "$f" || true
            sed -i.bak "s/Share\.share/debugPrint/g" "$f" || true
            sed -i.bak "s/Share\.shareXFiles/debugPrint/g" "$f" || true
          done
          cat pubspec.yaml | grep share || echo "share_plus GONE!"
          rm -rf android
          flutter create . --platforms=android --org com.velipoodhaam.vayvi
          rm -f pubspec.lock
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

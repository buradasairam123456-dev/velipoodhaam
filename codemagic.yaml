workflows:
  android-workflow:
    name: Velipoodhaam Build
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create and FORCE 34 for ALL
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.velipoodhaam.vayvi
          # 1. Force APP to 34
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.velipoodhaam.vayvi"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.toString()
              }
              defaultConfig {
                  applicationId = "com.velipoodhaam.vayvi"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          flutter {
              source = "../.."
          }
          EOF
          # 2. Force ALL LIBRARIES like share_plus to 34
          cat > android/build.gradle.kts << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          val newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
          rootProject.layout.buildDirectory.value(newBuildDir)
          subprojects {
              val newSubBuildDir = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubBuildDir)
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }
          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          subprojects {
              afterEvaluate {
                  if (hasProperty("android")) {
                      val androidExtension = extensions.findByName("android")
                      if (androidExtension is com.android.build.gradle.BaseExtension) {
                          androidExtension.compileSdkVersion(34)
                      }
                  }
              }
          }
          EOF
          echo "--- APP ---"
          cat android/app/build.gradle.kts
          echo "--- ROOT ---"
          cat android/build.gradle.kts
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release --split-per-abi --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
